<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Voxel Engine - WASM Port</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #111; color: white;
            font-family: Arial, sans-serif; display: flex; flex-direction: column;
            align-items: center; justify-content: center; height: 100vh; overflow: hidden;
        }
        #gameCanvas {
            background: #000; cursor: crosshair; border: 2px solid #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        .instructions {
            margin-top: 15px; text-align: center; font-size: 14px; color: #aaa;
        }
        .instructions kbd {
            background-color: #333; padding: 2px 6px; border-radius: 3px; border: 1px solid #555;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <div class="instructions">
        Click to lock mouse. <kbd>ESC</kbd> to pause/menu. <kbd>WASD</kbd> Move. <kbd>Mouse</kbd> Look. <kbd>Space</kbd> Jump. <kbd>Shift</kbd> Crouch. <kbd>R</kbd> Sprint.<br>
        <kbd>LMB</kbd> Break. <kbd>RMB</kbd> Place/Interact. <kbd>1-6</kbd> or <kbd>Scroll</kbd> Select Block.
    </div>

    <!-- The Go WASM bridge script -->
    <script src="wasm_exec.js"></script>
    <script>
        const go = new Go();
        WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject).then((result) => {
            go.run(result.instance);
        }).catch((err) => {
            console.error("Failed to load WASM: ", err);
            document.body.innerHTML = "<h1 style='color:red;'>Error loading WASM. Check console.</h1>";
        });
    </script>
</body>
</html>
